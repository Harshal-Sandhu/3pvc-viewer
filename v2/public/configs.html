<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3PVC Configs</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="login-view" class="view">
        <form id="otp-form" class="card login-card" autocomplete="off">
            <h1>3PVC Configs</h1>
            <p class="muted">Sign in with your greyorange.com email</p>
            <label>Email
                <input type="email" id="otp-email" autocomplete="username" placeholder="you@greyorange.com" required>
            </label>
            <button type="button" id="otp-send-btn">Send code</button>
            <div id="otp-code-row" hidden>
                <label>Code
                    <input type="text" id="otp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
                </label>
                <button type="submit" id="otp-verify-btn">Verify</button>
            </div>
            <p id="otp-status" class="muted small" hidden></p>
            <p id="otp-error" class="error" hidden></p>
        </form>
    </div>

    <div id="app-view" class="view" hidden>
        <header class="topbar">
            <h1>3PVC Configs</h1>
            <div class="topbar-right">
                <a href="/" class="btn-subtle" role="button">Viewer</a>
                <a href="/operation" class="btn-subtle" role="button">Operation</a>
                <a href="/admin" id="admin-link" class="btn-subtle" role="button" hidden>Admin</a>
                <span id="who" class="muted small"></span>
                <button id="logout-btn" type="button" class="btn-subtle">Sign out</button>
            </div>
        </header>

        <section class="controls card">
            <label>Site
                <select id="site-select"></select>
            </label>
            <button id="load-btn" type="button">Load configs</button>
            <label class="search-wrap">
                <input type="search" id="config-filter" placeholder="Filter (Cmd/Ctrl+K)" autocomplete="off">
            </label>
        </section>

        <section class="card">
            <div class="card-head">
                <h2 class="card-title">Firmware config</h2>
                <span id="config-status" class="muted small"></span>
            </div>
            <section id="chips-bar" class="chips-bar" hidden>
                <span class="muted small">Active filters:</span>
                <div id="config-chips"></div>
                <button id="clear-filters" type="button" class="btn-subtle btn-small">Clear all</button>
            </section>
            <div class="table-toolbar">
                <span id="config-row-count" class="muted small"></span>
                <div class="spacer"></div>
                <div class="col-menu-wrap">
                    <button id="col-menu-btn" type="button" class="btn-subtle btn-small">Columns</button>
                    <div id="col-menu" class="popover" hidden></div>
                </div>
            </div>
            <div id="model-tabs" class="model-tabs" role="tablist" hidden></div>
            <div class="table-wrap" id="config-grid-wrap">
                <div id="config-model-tables"></div>
            </div>
            <p id="config-empty" class="muted small" hidden>No bots loaded yet. Select a site and click Load configs.</p>
        </section>
    </div>

    <!-- Filter dropdown (positioned via JS) -->
    <div id="config-filter-popover" class="popover" hidden>
        <div class="popover-head">
            <input type="search" id="config-filter-search" placeholder="Search values..." autocomplete="off">
        </div>
        <div class="popover-body" id="config-filter-list"></div>
        <div class="popover-foot">
            <button id="config-filter-clear" type="button" class="btn-subtle btn-small">Clear</button>
            <button id="config-filter-apply" type="button" class="btn-small">Apply</button>
        </div>
    </div>

    <script src="/configs.js" type="module"></script>
</body>
</html>
